modules:
  http_any:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: [200, 204, 301, 302, 401, 403]
      tls_config:
        insecure_skip_verify: true   # Proxmox self-signed certs
  icmp:
    prober: icmp
    timeout: 3s
    icmp:
      preferred_ip_protocol: ip4
  dns_a:
    prober: dns
    timeout: 3s
    dns:
      query_name: google.com
      query_type: A
      preferred_ip_protocol: ip4
      transport_protocol: udp
